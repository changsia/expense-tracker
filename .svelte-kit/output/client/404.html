<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>Redirecting...</title>
	<script>
		const parts = location.pathname.split('/').slice(2);
		const target = parts.length ? '/' + parts.join('/') : '/';
		location.replace(target);
	</script>
</head>
<body></body>
</html>
